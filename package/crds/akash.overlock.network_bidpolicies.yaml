                          type: string
                        name:
                          description: Name is the name of the ActiveBid resource
                          type: string
                        namespace:
                          description: Namespace is the namespace of the ActiveBid
                            resource
                          type: string
                        price:
                          description: Price is the bid price in uAKT
                          format: int64
                          type: integer
                        provider:
                          description: Provider is the provider address for this bid
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  createdLeases:
                    additionalProperties:
                      description: LeaseReference contains a reference to a Lease
                        resource
                      properties:
                        createdAt:
                          description: CreatedAt is when this Lease was created
                          format: date-time
                          type: string
                        leaseId:
                          description: LeaseId is the lease ID from Akash
                          type: string
                        name:
                          description: Name is the name of the Lease resource
                          type: string
                        namespace:
                          description: Namespace is the namespace of the Lease resource
                          type: string
                      required:
                      - name
                      type: object
                    description: CreatedLeases is a map of deployment to created Lease
                      CR reference
                    type: object
                  eligibleBids:
                    description: EligibleBids is the number of bids meeting criteria
                    format: int32
                    type: integer
                  lastEvaluated:
                    description: LastEvaluated is the timestamp of last evaluation
                    format: date-time
                    type: string
                  matchedDeployments:
                    description: MatchedDeployments is a list of Deployment CRs matched
                      by selector
                    items:
                      description: DeploymentReference represents a reference to a
                        Deployment resource
                      properties:
                        name:
                          description: Name of the Deployment resource
                          type: string
                        namespace:
                          description: Namespace of the Deployment resource (optional,
                            defaults to same namespace)
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  rejectedBids:
                    description: RejectedBids is a list of rejected bids with reasons
                    items:
                      description: RejectedBidInfo contains information about a rejected
                        bid
                      properties:
                        bidId:
                          description: BidId is the unique identifier of the rejected
                            bid
                          type: string
                        price:
                          description: Price is the bid price in uAKT
                          format: int64
                          type: integer
                        provider:
                          description: Provider is the address of the provider
                          type: string
                        rejectedAt:
                          description: RejectedAt is when this bid was rejected
                          format: date-time
                          type: string
                        rejectionReason:
                          description: RejectionReason is why this bid was rejected
                          type: string
                      required:
                      - bidId
                      - price
                      - provider
                      - rejectedAt
                      - rejectionReason
                      type: object
                    type: array
                  selectedBids:
                    additionalProperties:
                      description: ActiveBidReference contains a reference to an ActiveBid
                        resource
                      properties:
                        bidId:
                          description: BidId is the bid ID associated with this ActiveBid
                          type: string
                        createdAt:
                          description: CreatedAt is when this ActiveBid was created
                          format: date-time
                          type: string
                        name:
                          description: Name is the name of the ActiveBid resource
                          type: string
                        namespace:
                          description: Namespace is the namespace of the ActiveBid
                            resource
                          type: string
                        price:
                          description: Price is the bid price in uAKT
                          format: int64
                          type: integer
                        provider:
                          description: Provider is the provider address for this bid
                          type: string
                      required:
                      - name
                      type: object
                    description: SelectedBids is a map of deployment to selected ActiveBid
                      CR reference
                    type: object
                  selectionReasons:
                    additionalProperties:
                      type: string
                    description: SelectionReasons is a map of deployment to reason
                      for bid selection
                    type: object
                  state:
                    description: State is the policy state (active, paused, failed)
                    type: string
                  totalBidsReceived:
                    description: TotalBidsReceived is the number of bids received
                      across all deployments
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
