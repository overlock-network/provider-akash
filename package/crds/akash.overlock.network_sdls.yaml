---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
  name: sdls.akash.overlock.network
spec:
  group: akash.overlock.network
  names:
    categories:
    - crossplane
    - managed
    - akash
    kind: SDL
    listKind: SDLList
    plural: sdls
    singular: sdl
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.validated
      name: VALIDATED
      type: boolean
    - jsonPath: .spec.forProvider.version
      name: VERSION
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: An SDL represents an Akash Stack Definition Language resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: An SDLSpec defines the desired state of an SDL.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: SDLParameters are the configurable fields of an SDL.
                properties:
                  deployment:
                    additionalProperties:
                      description: SDLDeploymentGroup defines the deployment configuration
                        for a service
                      properties:
                        count:
                          description: Count is the number of instances to deploy
                          format: int32
                          maximum: 100
                          minimum: 1
                          type: integer
                        profile:
                          description: Profile references a placement profile name
                          minLength: 1
                          type: string
                      required:
                      - count
                      - profile
                      type: object
                    description: Deployment contains deployment group configurations
                    minProperties: 1
                    type: object
                  profiles:
                    description: Profiles contains compute and placement profiles
                    properties:
                      compute:
                        additionalProperties:
                          description: SDLComputeProfile defines the computational
                            resources for a profile
                          properties:
                            resources:
                              description: Resources defines the resource requirements
                              properties:
                                cpu:
                                  description: CPU defines CPU units (can be fractional,
                                    e.g., "0.5", "100m")
                                  pattern: ^([0-9]+m?|[0-9]*\.[0-9]+)$
                                  type: string
                                gpu:
                                  description: GPU defines GPU requirements
                                  properties:
                                    attributes:
                                      additionalProperties:
                                        type: object
                                        x-kubernetes-preserve-unknown-fields: true
                                      description: Attributes defines GPU attributes
                                      type: object
                                    units:
                                      description: Units is the number of GPU units
                                      format: int32
                                      minimum: 1
                                      type: integer
                                  required:
                                  - units
                                  type: object
                                memory:
                                  description: Memory defines memory size (e.g., "512Mi",
                                    "2Gi")
                                  pattern: ^[0-9]+[KMGT]i?$
                                  type: string
                                storage:
                                  description: Storage defines ephemeral storage size
                                    (e.g., "1Gi", "10Gi")
                                  items:
                                    description: SDLStorage defines storage requirements
                                    properties:
                                      class:
                                        description: Class is the storage class
                                        enum:
                                        - default
                                        - beta1
                                        - beta2
                                        - beta3
                                        type: string
                                      name:
                                        description: Name is the storage name
                                        type: string
                                      size:
                                        description: Size is the storage size (e.g.,
                                          "1Gi", "10Gi")
                                        pattern: ^[0-9]+[KMGT]i?$
                                        type: string
                                    required:
                                    - size
                                    type: object
                                  type: array
                              required:
                              - cpu
                              - memory
                              type: object
                          required:
                          - resources
                          type: object
                        description: Compute defines the compute resource profiles
                        minProperties: 1
                        type: object
                      placement:
                        additionalProperties:
                          description: SDLPlacementProfile defines placement constraints
                            and pricing
                          properties:
                            attributes:
                              additionalProperties:
                                type: string
                              description: Attributes defines provider attributes
                              type: object
                            pricing:
                              additionalProperties:
                                description: |-
                                  SDLPricing defines pricing information for a service.
                                  Node v2 BME hard-codes the price denom to uact, so it is not user-configurable.
                                properties:
                                  amount:
                                    description: Amount is the price amount in uact
                                    format: int64
                                    minimum: 1
                                    type: integer
                                required:
                                - amount
                                type: object
                              description: Pricing defines pricing information for
                                services
                              minProperties: 1
                              type: object
                            signedBy:
                              description: SignedBy defines signing requirements for
                                placement
                              properties:
                                allOf:
                                  description: AllOf requires signatures from all
                                    listed addresses
                                  items:
                                    type: string
                                  type: array
                                anyOf:
                                  description: AnyOf requires signature from any of
                                    the listed addresses
                                  items:
                                    type: string
                                  type: array
                              type: object
                          required:
                          - pricing
                          type: object
                        description: Placement defines the placement profiles
                        minProperties: 1
                        type: object
                    required:
                    - compute
                    - placement
                    type: object
                  services:
                    additionalProperties:
                      description: SDLService defines a service within the SDL
                      properties:
                        args:
                          description: Args are the arguments for the custom command
                          items:
                            type: string
                          type: array
                        command:
                          description: Command is the custom container execution command
                          items:
                            type: string
                          type: array
                        depends-on:
                          description: DependsOn lists services this service depends
                            on (future use)
                          items:
                            type: string
                          type: array
                        env:
                          description: Env is the list of environment variables
                          items:
                            type: string
                          type: array
                        expose:
                          description: Expose defines the ports and services to expose
                          items:
                            description: SDLServiceExpose defines how a service port
                              should be exposed
                            properties:
                              accept:
                                description: Accept defines ingress specifications
                                properties:
                                  items:
                                    description: Items is the list of accepted items
                                    items:
                                      type: string
                                    type: array
                                type: object
                              as:
                                description: As is the external port number
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              http_options:
                                description: HTTPOptions defines HTTP specific options
                                properties:
                                  max_body_size:
                                    description: MaxBodySize is the maximum body size
                                    format: int32
                                    type: integer
                                  next_cases:
                                    description: NextCases is the list of next cases
                                    items:
                                      type: string
                                    type: array
                                  next_timeout:
                                    description: NextTimeout is the next timeout
                                    format: int32
                                    type: integer
                                  next_tries:
                                    description: NextTries is the number of next tries
                                    format: int32
                                    type: integer
                                  read_timeout:
                                    description: ReadTimeout is the read timeout
                                    format: int32
                                    type: integer
                                  send_timeout:
                                    description: SendTimeout is the send timeout
                                    format: int32
                                    type: integer
                                type: object
                              port:
                                description: Port is the container port to expose
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              proto:
                                default: tcp
                                description: Proto is the protocol (TCP/UDP)
                                enum:
                                - tcp
                                - udp
                                type: string
                              to:
                                description: To defines the exposure scope
                                items:
                                  description: SDLServiceExposeTo defines the exposure
                                    scope for a port
                                  properties:
                                    global:
                                      description: Global indicates if the port should
                                        be globally accessible
                                      type: boolean
                                    service:
                                      description: Service defines internal service
                                        exposure
                                      type: string
                                  type: object
                                type: array
                            required:
                            - port
                            type: object
                          type: array
                        image:
                          description: Image is the Docker image for the container
                          minLength: 1
                          type: string
                        params:
                          description: Params defines service parameters like storage
                          properties:
                            storage:
                              additionalProperties:
                                description: SDLStorageParams defines storage parameters
                                properties:
                                  mount:
                                    description: Mount is the mount path
                                    type: string
                                  readOnly:
                                    description: ReadOnly indicates if the storage
                                      is read-only
                                    type: boolean
                                required:
                                - mount
                                type: object
                              description: Storage defines storage parameters
                              type: object
                          type: object
                      required:
                      - image
                      type: object
                    description: Services is the map of service definitions
                    minProperties: 1
                    type: object
                  version:
                    description: Version is the SDL version (currently only "2.0"
                      is supported)
                    enum:
                    - "2.0"
                    type: string
                required:
                - deployment
                - profiles
                - services
                - version
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              publishConnectionDetailsTo:
                description: |-
                  PublishConnectionDetailsTo specifies the connection secret config which
                  contains a name, metadata and a reference to secret store config to
                  which any connection details for this managed resource should be written.
                  Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  configRef:
                    default:
                      name: default
                    description: |-
                      SecretStoreConfigRef specifies which secret store config should be used
                      for this ConnectionSecret.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  metadata:
                    description: Metadata is the metadata for connection secret.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          Annotations are the annotations to be added to connection secret.
                          - For Kubernetes secrets, this will be used as "metadata.annotations".
                          - It is up to Secret Store implementation for others store types.
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels are the labels/tags to be added to connection secret.
                          - For Kubernetes secrets, this will be used as "metadata.labels".
                          - It is up to Secret Store implementation for others store types.
                        type: object
                      type:
                        description: |-
                          Type is the SecretType for the connection secret.
                          - Only valid for Kubernetes Secret Stores.
                        type: string
                    type: object
                  name:
                    description: Name is the name of the connection secret.
                    type: string
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                  This field is planned to be replaced in a future release in favor of
                  PublishConnectionDetailsTo. Currently, both could be set independently
                  and connection details would be published to both without affecting
                  each other.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            description: An SDLStatus represents the observed state of an SDL.
            properties:
              atProvider:
                description: SDLObservation are the observable fields of an SDL.
                properties:
                  hash:
                    description: Hash is the content hash of the SDL for change detection
                    type: string
                  lastValidated:
                    description: LastValidated is the timestamp of the last validation
                    format: date-time
                    type: string
                  validated:
                    description: Validated indicates if the SDL has been validated
                    type: boolean
                  validationErrors:
                    description: ValidationErrors contains any validation error messages
                    items:
                      type: string
                    type: array
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
