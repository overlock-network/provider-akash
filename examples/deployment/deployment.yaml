apiVersion: akash.overlock.network/v1alpha1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  providerConfigRef:
    name: sandbox
  forProvider:
    # Reference to SDL custom resource
    sdlRef:
      name: simple-web-app
      namespace: default

    # Deployment deposit in uact (node v2 BME — denom is fixed to uact)
    deposit: 5000000

  # Connection secret for deployment details
  writeConnectionSecretToRef:
    name: nginx-deployment-connection
    namespace: default
