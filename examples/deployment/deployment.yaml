apiVersion: akash.overlock.network/v1alpha1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  providerConfigRef:
    name: sandbox
  forProvider:
    # Reference to SDL custom resource
    sdlRef:
      name: simple-web-app
      namespace: default

    # Deployment deposit in uakt (5 AKT = 5,000,000 uakt)
    deposit: 5000000
    
    # Token denomination
    currency: uakt

  # Connection secret for deployment details
  writeConnectionSecretToRef:
    name: nginx-deployment-connection
    namespace: default
