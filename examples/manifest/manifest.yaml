apiVersion: akash.overlock.network/v1alpha1
kind: Manifest
metadata:
  name: web-app-manifest
  namespace: default
spec:
  providerConfigRef:
    name: default
  forProvider:
    leaseRef:
      name: web-app-lease
      namespace: default
    # Secret holding mTLS keypair (tls.crt, tls.key) — typically the
    # connection-details Secret a Certificate CR publishes.
    certificateSecretRef:
      name: web-app-cert-conn
      namespace: default