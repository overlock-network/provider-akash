apiVersion: akash.overlock.network/v1alpha1
kind: Certificate
metadata:
  name: web-app-certificate
  namespace: default
spec:
  providerConfigRef:
    name: default
  # Publish tls.crt/tls.key as a Secret. The Manifest CR points at this
  # same Secret via certificateSecretRef.
  writeConnectionSecretToRef:
    name: web-app-cert-conn
    namespace: default
  forProvider:
    domains:
      - example.com
      - www.example.com
    autoRenew: true
    validityDays: 365