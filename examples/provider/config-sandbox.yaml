apiVersion: v1
kind: Secret
metadata:
  name: akash-sandbox-wallet-secret
  namespace: crossplane-system
type: Opaque
stringData:
  # Your Akash sandbox wallet private key (hex-encoded).
  # Export from an existing key:
  #   akash keys export sandbox-key --keyring-backend test --unarmored-hex --unsafe
  # Then fund it from the sandbox faucet: https://faucet.sandbox-01.aksh.pw/
  privateKey: "<your-sandbox-wallet-private-key-hex-here>"

---

apiVersion: akash.overlock.network/v1alpha1
kind: ProviderConfig
metadata:
  name: sandbox
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: akash-sandbox-wallet-secret
      key: privateKey
  configuration:
    keyName: "sandbox-key"
    keyringBackend: "test"
    net: "sandbox"
    chainId: "sandbox-01"
    node: "https://rpc.sandbox-01.aksh.pw:443"
    providersApi: "https://api.sandbox-01.aksh.pw"
