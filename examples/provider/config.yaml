apiVersion: v1
kind: Secret
metadata:
  name: example-provider-secret
type: Opaque
data:
  credentials: "RVhBTVBMRQo="

---

apiVersion: akash.overlock.network/v1alpha1
kind: ProviderConfig
metadata:
  name: example
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: example-provider-secret
      key: credentials
  configuration:
    keyName: "default"
    keyringBackend: "test"
    net: "mainnet"
    version: "0.18.0"
    chainId: "akashnet-2"
    node: "https://rpc.akashnet.io:443"
    home: "/tmp/.akash"
    path: "/usr/local/bin/akash"
    providersApi: "https://akash-api.polkachu.com"

---

apiVersion: akash.overlock.network/v1alpha1
kind: SDL
metadata:
  name: simple-web-app
  namespace: default
spec:
  providerConfigRef:
    name: sandbox
  forProvider:
    version: "2.0"
    services:
      web:
        image: nginx:1.21.6
        expose:
          - port: 80
            as: 80
            to:
              - global: true
    profiles:
      compute:
        web:
          resources:
            cpu: "0.5"
            memory: "512Mi"
            storage:
              - size: "1Gi"
      placement:
        westcoast:
          attributes:
            region: us-west
          pricing:
            web:
              amount: 100
    deployment:
      web:
        profile: westcoast
        count: 1