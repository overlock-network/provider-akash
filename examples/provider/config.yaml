apiVersion: v1
kind: Secret
metadata:
  name: akash-wallet-secret
  namespace: crossplane-system
type: Opaque
stringData:
  # ASCII-armored private key, exported with:
  #   akash keys export <key-name> --keyring-backend os
  # The export command prompts for an encryption passphrase — store the
  # same value below in `passphrase`.
  privateKey: |
    -----BEGIN TENDERMINT PRIVATE KEY-----
    salt: <...>
    type: secp256k1
    kdf: bcrypt

    <armored-body>
    -----END TENDERMINT PRIVATE KEY-----
  passphrase: "<passphrase-used-during-export>"

---

apiVersion: akash.overlock.network/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: akash-wallet-secret
      key: privateKey
  passphrase:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: akash-wallet-secret
      key: passphrase
  configuration:
    keyName: "default"
    keyringBackend: "os"
    net: "mainnet"
    chainId: "akashnet-2"
    node: "https://rpc.akashnet.io:443"
    providersApi: "https://akash-api.polkachu.com"
