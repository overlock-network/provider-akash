apiVersion: v1
kind: Secret
metadata:
  name: akash-wallet-secret
  namespace: crossplane-system
type: Opaque
stringData:
  # Your Akash wallet mnemonic (24-word seed phrase).
  # Export from an existing key:
  #   akash keys export <key-name> --keyring-backend os --unarmored-hex --unsafe
  credentials: "<your-wallet-mnemonic-here>"

---

apiVersion: akash.overlock.network/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: akash-wallet-secret
      key: credentials
  configuration:
    keyName: "default"
    keyringBackend: "os"
    net: "mainnet"
    chainId: "akashnet-2"
    node: "https://rpc.akashnet.io:443"
    providersApi: "https://akash-api.polkachu.com"
