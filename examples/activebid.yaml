apiVersion: akash.overlock.network/v1alpha1
kind: ActiveBid
metadata:
  name: example-activebid-observer
spec:
  providerConfigRef:
    name: default
  forProvider:
    deploymentRef:
      name: example-deployment
      # namespace: default  # Optional - defaults to same namespace
    bidId: "akash1owner-12345-1-1-akash1provider"  # Set by BidPolicy controller
---
apiVersion: akash.overlock.network/v1alpha1
kind: ActiveBid
metadata:
  name: example-activebid-different-provider
spec:
  providerConfigRef:
    name: default
  forProvider:
    deploymentRef:
      name: example-deployment
    bidId: "akash1owner-12345-1-1-akash1provider2"  # Different provider's bid
---
apiVersion: akash.overlock.network/v1alpha1
kind: ActiveBid
metadata:
  name: cross-namespace-activebid
  namespace: bid-observers
spec:
  providerConfigRef:
    name: default
  forProvider:
    deploymentRef:
      name: production-app
      namespace: production  # Reference deployment in different namespace
    bidId: "akash1owner-67890-1-1-akash1prodprovider"